<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>عائلة الطلاع</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Tahoma, sans-serif;
    background: #f4f6f8;
    color: #222;
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 500px;
    margin: 40px auto;
    padding: 15px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 25px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.logo {
    text-align: center;
    margin-bottom: 20px;
}

.logo h1 {
    font-size: 28px;
    color: #1d3557;
}

.logo p {
    margin-top: 8px;
    color: #777;
}

.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.tabs button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: #e9ecef;
    font-size: 16px;
}

.tabs button.active {
    background: #1d3557;
    color: white;
}

.form-section {
    display: none;
}

.form-section.active {
    display: block;
}

label {
    display: block;
    margin-top: 14px;
    margin-bottom: 6px;
    font-weight: bold;
}

input,
select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
}

input:focus,
select:focus {
    border-color: #1d3557;
}

.main-button {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: #1d3557;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

.main-button:hover {
    opacity: 0.9;
}

.message {
    display: none;
    margin-top: 15px;
    padding: 12px;
    border-radius: 10px;
    text-align: center;
}

.message.success {
    display: block;
    background: #d8f3dc;
    color: #1b4332;
}

.message.error {
    display: block;
    background: #ffe5e5;
    color: #9b2226;
}

.dynamic-box {
    margin-top: 15px;
}

.person-box {
    background: #f8f9fa;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 15px;
    margin-top: 12px;
}

.person-box h3 {
    margin-bottom: 10px;
    color: #1d3557;
}

.small-note {
    font-size: 13px;
    color: #777;
    margin-top: 5px;
}

.hidden {
    display: none;
}

</style>

</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">

            <h1>عائلة الطلاع</h1>

            <p>
                نظام أفراد ومجالس العائلة
            </p>

        </div>

        <div class="tabs">

            <button
                id="loginTab"
                class="active"
                onclick="showLogin()">

                تسجيل الدخول

            </button>

            <button
                id="registerTab"
                onclick="showRegister()">

                إنشاء حساب

            </button>

        </div>        <!-- ========================= -->
        <!-- قسم تسجيل الدخول -->
        <!-- ========================= -->

        <div
            id="loginSection"
            class="form-section active">

            <label for="loginIdentifier">
                الاسم الثلاثي أو رقم الهوية أو رقم الهاتف
            </label>

            <input
                type="text"
                id="loginIdentifier"
                placeholder="مثال: أحمد محمد علي أو رقم الهوية أو الهاتف"
                autocomplete="username"
            >

            <label for="loginPassword">
                كلمة المرور
            </label>

            <input
                type="password"
                id="loginPassword"
                placeholder="أدخل كلمة المرور"
                autocomplete="current-password"
            >

            <button
                class="main-button"
                onclick="login()">

                تسجيل الدخول

            </button>

            <div
                id="loginMessage"
                class="message">
            </div>

        </div>


        <!-- ========================= -->
        <!-- قسم إنشاء الحساب -->
        <!-- ========================= -->

        <div
            id="registerSection"
            class="form-section">

            <label for="registerName">
                الاسم الثلاثي
            </label>

            <input
                type="text"
                id="registerName"
                placeholder="مثال: أحمد محمد علي"
            >

            <div class="small-note">
                يجب كتابة الاسم الأول واسم الأب واسم العائلة
            </div>


            <label for="registerNationalId">
                رقم الهوية
            </label>

            <input
                type="text"
                id="registerNationalId"
                placeholder="رقم الهوية - 9 أرقام"
                inputmode="numeric"
                maxlength="9"
            >


            <label for="registerPhone">
                رقم الهاتف
            </label>

            <input
                type="text"
                id="registerPhone"
                placeholder="059XXXXXXX أو 056XXXXXXX"
                inputmode="numeric"
                maxlength="10"
            >


            <label for="maritalStatus">
                الحالة الاجتماعية
            </label>

            <select
                id="maritalStatus"
                onchange="maritalChanged()">

                <option value="">
                    اختر الحالة الاجتماعية
                </option>

                <option value="أعزب">
                    أعزب
                </option>

                <option value="متزوج">
                    متزوج
                </option>

            </select>


            <!-- الزوجات -->

            <div
                id="wivesContainer"
                class="dynamic-box hidden">

                <label for="wivesCount">
                    عدد الزوجات
                </label>

                <input
                    type="number"
                    id="wivesCount"
                    min="1"
                    max="20"
                    value="1"
                    onchange="createWifeFields()"
                >

                <div
                    id="wivesFields">
                </div>

            </div>


            <!-- الأبناء -->

            <div class="dynamic-box">

                <label for="childrenCount">
                    عدد الأبناء
                </label>

                <input
                    type="number"
                    id="childrenCount"
                    min="0"
                    max="100"
                    value="0"
                    onchange="createChildrenFields()"
                >

                <div
                    id="childrenFields">
                </div>

            </div>


            <label for="registerPassword">
                كلمة المرور
            </label>

            <input
                type="password"
                id="registerPassword"
                placeholder="6 أحرف أو أرقام على الأقل"
                autocomplete="new-password"
            >


            <label for="registerPasswordConfirm">
                تأكيد كلمة المرور
            </label>

            <input
                type="password"
                id="registerPasswordConfirm"
                placeholder="أعد كتابة كلمة المرور"
                autocomplete="new-password"
            >


            <button
                class="main-button"
                onclick="register()">

                إنشاء الحساب

            </button>


            <div
                id="registerMessage"
                class="message">
            </div>

        </div>

    </div>

</div><script>

// ===============================
// رابط الباك إند
// ===============================

// إذا كانت صفحة login.html على نفس السيرفر:
// اتركه فارغًا

const API_URL = "";


// ===============================
// إظهار رسالة
// ===============================

function showMessage(elementId, message, type) {

    const element = document.getElementById(elementId);

    element.textContent = message;

    element.className = "message " + type;

}


// ===============================
// صفحة تسجيل الدخول
// ===============================

function showLogin() {

    document
        .getElementById("loginSection")
        .classList.add("active");

    document
        .getElementById("registerSection")
        .classList.remove("active");


    document
        .getElementById("loginTab")
        .classList.add("active");

    document
        .getElementById("registerTab")
        .classList.remove("active");

}


// ===============================
// صفحة إنشاء الحساب
// ===============================

function showRegister() {

    document
        .getElementById("registerSection")
        .classList.add("active");

    document
        .getElementById("loginSection")
        .classList.remove("active");


    document
        .getElementById("registerTab")
        .classList.add("active");

    document
        .getElementById("loginTab")
        .classList.remove("active");

}


// ===============================
// تغيير الحالة الاجتماعية
// ===============================

function maritalChanged() {

    const status =
        document.getElementById("maritalStatus").value;

    const wivesContainer =
        document.getElementById("wivesContainer");


    if (status === "متزوج") {

        wivesContainer.classList.remove("hidden");

        createWifeFields();

    } else {

        wivesContainer.classList.add("hidden");

        document.getElementById("wivesFields").innerHTML = "";

    }

}


// ===============================
// إنشاء حقول الزوجات
// ===============================

function createWifeFields() {

    const count =
        Number(document.getElementById("wivesCount").value);

    const container =
        document.getElementById("wivesFields");


    container.innerHTML = "";


    if (
        !Number.isInteger(count) ||
        count < 1 ||
        count > 20
    ) {

        return;

    }


    for (let i = 0; i < count; i++) {

        const box =
            document.createElement("div");

        box.className = "person-box";


        box.innerHTML = `

            <h3>
                الزوجة ${i + 1}
            </h3>

            <label>
                اسم الزوجة الثلاثي
            </label>

            <input
                type="text"
                class="wife-name"
                placeholder="مثال: سارة محمد علي"
            >

            <label>
                رقم هوية الزوجة
            </label>

            <input
                type="text"
                class="wife-id"
                placeholder="9 أرقام"
                maxlength="9"
                inputmode="numeric"
            >

        `;


        container.appendChild(box);

    }

}


// ===============================
// إنشاء حقول الأبناء
// ===============================

function createChildrenFields() {

    const count =
        Number(document.getElementById("childrenCount").value);

    const container =
        document.getElementById("childrenFields");


    container.innerHTML = "";


    if (
        !Number.isInteger(count) ||
        count < 0 ||
        count > 100
    ) {

        return;

    }


    for (let i = 0; i < count; i++) {

        const box =
            document.createElement("div");

        box.className = "person-box";


        box.innerHTML = `

            <h3>
                الابن / الابنة ${i + 1}
            </h3>

            <label>
                الاسم الثلاثي
            </label>

            <input
                type="text"
                class="child-name"
                placeholder="مثال: محمد أحمد علي"
            >

            <label>
                رقم الهوية
            </label>

            <input
                type="text"
                class="child-id"
                placeholder="9 أرقام"
                maxlength="9"
                inputmode="numeric"
            >

        `;


        container.appendChild(box);

    }

}


// ===============================
// إنشاء الحساب
// ===============================

async function register() {

    const name =
        document.getElementById("registerName")
        .value.trim();


    const nationalId =
        document.getElementById("registerNationalId")
        .value.trim();


    const phone =
        document.getElementById("registerPhone")
        .value.trim();


    const maritalStatus =
        document.getElementById("maritalStatus")
        .value;


    const password =
        document.getElementById("registerPassword")
        .value;


    const passwordConfirm =
        document.getElementById("registerPasswordConfirm")
        .value;


    const childrenCount =
        Number(
            document.getElementById("childrenCount").value
        );


    let wives = [];

    let wivesCount = 0;


    // ===============================
    // التحقق من الاسم
    // ===============================

    if (name.split(/\s+/).length !== 3) {

        showMessage(
            "registerMessage",
            "يرجى كتابة الاسم الثلاثي بشكل صحيح",
            "error"
        );

        return;

    }


    // ===============================
    // التحقق من الهوية
    // ===============================

    if (!/^\d{9}$/.test(nationalId)) {

        showMessage(
            "registerMessage",
            "رقم الهوية يجب أن يتكون من 9 أرقام",
            "error"
        );

        return;

    }


    // ===============================
    // التحقق من الهاتف
    // ===============================

    if (!/^(059|056)\d{7}$/.test(phone)) {

        showMessage(
            "registerMessage",
            "رقم الهاتف يجب أن يبدأ بـ 059 أو 056 ويتكون من 10 أرقام",
            "error"
        );

        return;

    }


    // ===============================
    // التحقق من الحالة
    // ===============================

    if (
        maritalStatus !== "أعزب" &&
        maritalStatus !== "متزوج"
    ) {

        showMessage(
            "registerMessage",
            "يرجى اختيار الحالة الاجتماعية",
            "error"
        );

        return;

    }


    // ===============================
    // جمع بيانات الزوجات
    // ===============================

    if (maritalStatus === "متزوج") {

        wivesCount =
            Number(
                document.getElementById("wivesCount").value
            );


        if (
            !Number.isInteger(wivesCount) ||
            wivesCount < 1 ||
            wivesCount > 20
        ) {

            showMessage(
                "registerMessage",
                "عدد الزوجات يجب أن يكون من 1 إلى 20",
                "error"
            );

            return;

        }


        const wifeNames =
            document.querySelectorAll(".wife-name");

        const wifeIds =
            document.querySelectorAll(".wife-id");


        for (let i = 0; i < wivesCount; i++) {

            const wifeName =
                wifeNames[i].value.trim();

            const wifeId =
                wifeIds[i].value.trim();


            if (
                wifeName.split(/\s+/).length !== 3
            ) {

                showMessage(
                    "registerMessage",
                    `يرجى كتابة اسم الزوجة ${i + 1} ثلاثيًا`,
                    "error"
                );

                return;

            }


            if (!/^\d{9}$/.test(wifeId)) {

                showMessage(
                    "registerMessage",
                    `رقم هوية الزوجة ${i + 1} يجب أن يتكون من 9 أرقام`,
                    "error"
                );

                return;

            }


            wives.push({

                name: wifeName,

                nationalId: wifeId

            });

        }

    }


    // ===============================
    // جمع بيانات الأبناء
    // ===============================

    if (
        !Number.isInteger(childrenCount) ||
        childrenCount < 0 ||
        childrenCount > 100
    ) {

        showMessage(
            "registerMessage",
            "عدد الأبناء يجب أن يكون من 0 إلى 100",
            "error"
        );

        return;

    }


    const childNames =
        document.querySelectorAll(".child-name");

    const childIds =
        document.querySelectorAll(".child-id");


    let children = [];


    for (let i = 0; i < childrenCount; i++) {

        const childName =
            childNames[i].value.trim();

        const childId =
            childIds[i].value.trim();


        if (
            childName.split(/\s+/).length !== 3
        ) {

            showMessage(
                "registerMessage",
                `يرجى كتابة اسم الابن/الابنة ${i + 1} ثلاثيًا`,
                "error"
            );

            return;

        }


        if (!/^\d{9}$/.test(childId)) {

            showMessage(
                "registerMessage",
                `رقم هوية الابن/الابنة ${i + 1} يجب أن يتكون من 9 أرقام`,
                "error"
            );

            return;

        }


        children.push({

            name: childName,

            nationalId: childId

        });

    }


    // ===============================
    // كلمة المرور
    // ===============================

    if (password.length < 6) {

        showMessage(
            "registerMessage",
            "كلمة المرور يجب أن تكون 6 أحرف أو أرقام على الأقل",
            "error"
        );

        return;

    }


    if (password !== passwordConfirm) {

        showMessage(
            "registerMessage",
            "كلمتا المرور غير متطابقتين",
            "error"
        );

        return;

    }


    // ===============================
    // إرسال البيانات للسيرفر
    // ===============================

    try {

        showMessage(
            "registerMessage",
            "جاري إنشاء الحساب...",
            "success"
        );


        const response =
            await fetch(
                `${API_URL}/api/register`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        name,

                        nationalId,

                        phone,

                        password,

                        maritalStatus,

                        wivesCount,

                        wives,

                        childrenCount,

                        children

                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "فشل إنشاء الحساب"
            );

        }


        localStorage.setItem(
            "tala_token",
            data.token
        );


        localStorage.setItem(
            "tala_user",
            JSON.stringify(data.user)
        );


        showMessage(
            "registerMessage",
            "تم إنشاء الحساب بنجاح ✅",
            "success"
        );


        setTimeout(() => {

            window.location.href = "home.html";

        }, 1000);


    } catch (error) {

        console.error(
            "REGISTER ERROR:",
            error
        );


        showMessage(
            "registerMessage",
            error.message ||
            "تعذر الاتصال بالسيرفر",
            "error"
        );

    }

}


// ===============================
// تسجيل الدخول
// ===============================

async function login() {

    const identifier =
        document.getElementById("loginIdentifier")
        .value.trim();


    const password =
        document.getElementById("loginPassword")
        .value;


    if (!identifier || !password) {

        showMessage(
            "loginMessage",
            "يرجى إدخال بيانات تسجيل الدخول",
            "error"
        );

        return;

    }


    try {

        showMessage(
            "loginMessage",
            "جاري تسجيل الدخول...",
            "success"
        );


        const response =
            await fetch(
                `${API_URL}/api/login`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        identifier,

                        password

                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "بيانات تسجيل الدخول غير صحيحة"
            );

        }


        localStorage.setItem(
            "tala_token",
            data.token
        );


        localStorage.setItem(
            "tala_user",
            JSON.stringify(data.user)
        );


        showMessage(
            "loginMessage",
            "تم تسجيل الدخول بنجاح ✅",
            "success"
        );


        setTimeout(() => {

            window.location.href = "home.html";

        }, 700);


    } catch (error) {

        console.error(
            "LOGIN ERROR:",
            error
        );


        showMessage(
            "loginMessage",
            error.message ||
            "تعذر الاتصال بالسيرفر",
            "error"
        );

    }

}

</script>

</body>

</html>
