<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>مجلس العائلة</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Tahoma, sans-serif;
        }

        body {
            background: #f4f7f5;
            color: #222;
        }

        header {
            background: linear-gradient(
                135deg,
                #075e35,
                #0c8a52
            );

            color: white;
            padding: 25px 15px;
            text-align: center;
        }

        header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        header p {
            font-size: 15px;
            opacity: 0.9;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px 15px;
        }

        .back-btn {
            border: none;
            background: #075e35;
            color: white;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            background: #0c8a52;
        }

        .council-info {
            background: white;
            border-radius: 18px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .council-icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .council-info h2 {
            color: #075e35;
            margin-bottom: 10px;
        }

        .council-info p {
            color: #666;
            line-height: 1.8;
        }        .post-form {
            background: white;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .post-form h3 {
            color: #075e35;
            margin-bottom: 18px;
            text-align: center;
        }

        .type-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .type-buttons button {
            flex: 1;
            border: 1px solid #075e35;
            background: white;
            color: #075e35;
            padding: 11px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
        }

        .type-buttons button.active {
            background: #075e35;
            color: white;
        }

        .post-form input,
        .post-form textarea {
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
            font-size: 15px;
            outline: none;
        }

        .post-form input:focus,
        .post-form textarea:focus {
            border-color: #075e35;
        }

        .post-form textarea {
            min-height: 120px;
            resize: vertical;
        }

        .publish-btn {
            width: 100%;
            border: none;
            background: #075e35;
            color: white;
            padding: 13px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        .publish-btn:hover {
            background: #0c8a52;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
        }

        .message.success {
            background: #e8f5ee;
            color: #075e35;
        }

        .message.error {
            background: #fdeaea;
            color: #b71c1c;
        }

        .posts-title {
            color: #075e35;
            text-align: center;
            margin: 25px 0 15px;
        }

        .post-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.07);
        }

        .post-type {
            display: inline-block;
            background: #e8f5ee;
            color: #075e35;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .post-card h3 {
            margin-bottom: 8px;
            color: #222;
        }

        .post-card p {
            color: #555;
            line-height: 1.8;
            white-space: pre-wrap;
        }

        .post-meta {
            margin-top: 12px;
            color: #888;
            font-size: 13px;
        }

        .empty {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            color: #777;
        }

        @media (max-width: 600px) {

            .type-buttons {
                flex-direction: column;
            }

        }

    </style>

</head>

<body>

    <header>

        <h1 id="councilTitle">
            مجلس العائلة
        </h1>

        <p>
            مساحة خاصة بأعضاء المجلس
        </p>

    </header>

    <main class="container">

        <button
            class="back-btn"
            onclick="goBack()">
            ← العودة إلى الرئيسية
        </button>

        <section class="council-info">

            <div class="council-icon">
                🏠
            </div>

            <h2 id="councilName">
                مجلس العائلة
            </h2>

            <p>
                هنا يمكن لأعضاء المجلس مشاركة
                الأخبار والمناسبات العائلية.
            </p>

        </section>

        <div
            id="message"
            class="message">
        </div>

        <section class="post-form">

            <h3>
                نشر خبر أو مناسبة
            </h3>

        <div class="type-buttons">

            <button
                id="newsBtn"
                class="active"
                onclick="selectType('خبر')">
                📰 خبر
            </button>

            <button
                id="eventBtn"
                onclick="selectType('مناسبة')">
                🎉 مناسبة
            </button>

        </div>

        <input
            type="text"
            id="postTitle"
            placeholder="عنوان الخبر أو المناسبة">

        <textarea
            id="postContent"
            placeholder="اكتب تفاصيل الخبر أو المناسبة هنا...">
        </textarea>

        <button
            class="publish-btn"
            onclick="publishPost()">
            نشر
        </button>

        </section>        <h2 class="posts-title">
            الأخبار والمناسبات
        </h2>

        <section id="posts">

            <div class="empty">
                جاري تحميل المنشورات...
            </div>

        </section>

    </main>


    <script>

        // =========================
        // إعدادات الموقع
        // =========================

        const API_URL = "";

        let selectedType = "خبر";

        const params =
            new URLSearchParams(
                window.location.search
            );

        const councilId =
            Number(params.get("id"));


        // =========================
        // أسماء المجالس
        // =========================

        const councils = {

            1: "مجلس العائلة في مخيم المغازي",

            2: "مجلس العائلة في مخيم النصيرات"

        };


        // =========================
        // التحقق من تسجيل الدخول
        // =========================

        const token =
            localStorage.getItem("tala_token");


        if (!token) {

            alert(
                "يجب تسجيل الدخول أولًا"
            );

            window.location.href =
                "login.html";

        }


        // =========================
        // التحقق من رقم المجلس
        // =========================

        if (!councils[councilId]) {

            alert(
                "المجلس غير موجود"
            );

            window.location.href =
                "index.html";

        }


        // =========================
        // عرض اسم المجلس
        // =========================

        document.getElementById(
            "councilTitle"
        ).textContent =
            councils[councilId];


        document.getElementById(
            "councilName"
        ).textContent =
            councils[councilId];


        // =========================
        // اختيار نوع المنشور
        // =========================

        function selectType(type) {

            selectedType = type;

            const newsBtn =
                document.getElementById(
                    "newsBtn"
                );

            const eventBtn =
                document.getElementById(
                    "eventBtn"
                );

            if (type === "خبر") {

                newsBtn.classList.add(
                    "active"
                );

                eventBtn.classList.remove(
                    "active"
                );

            } else {

                eventBtn.classList.add(
                    "active"
                );

                newsBtn.classList.remove(
                    "active"
                );

            }

        }


        // =========================
        // إظهار رسالة
        // =========================

        function showMessage(
            text,
            type
        ) {

            const box =
                document.getElementById(
                    "message"
                );

            box.textContent = text;

            box.className =
                "message " + type;

            box.style.display =
                "block";

        }


        // =========================
        // نشر منشور
        // =========================

        async function publishPost() {

            const title =
                document.getElementById(
                    "postTitle"
                ).value.trim();

            const content =
                document.getElementById(
                    "postContent"
                ).value.trim();


            if (!title || !content) {

                showMessage(
                    "يرجى كتابة العنوان والتفاصيل",
                    "error"
                );

                return;

            }


            try {

                const response =
                    await fetch(
                        API_URL +
                        "/api/councils/" +
                        councilId +
                        "/posts",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    "Bearer " +
                                    token

                            },

                            body: JSON.stringify({

                                type:
                                    selectedType,

                                title:
                                    title,

                                content:
                                    content

                            })

                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    showMessage(
                        data.message ||
                        "تعذر نشر المنشور",
                        "error"
                    );

                    return;

                }


                showMessage(
                    "تم نشر " +
                    selectedType +
                    " بنجاح",
                    "success"
                );


                document.getElementById(
                    "postTitle"
                ).value = "";


                document.getElementById(
                    "postContent"
                ).value = "";


                loadPosts();


            } catch (error) {

                console.error(error);

                showMessage(
                    "تعذر الاتصال بالخادم",
                    "error"
                );

            }

        }


        // =========================
        // تحميل المنشورات
        // =========================

        async function loadPosts() {

            const postsBox =
                document.getElementById(
                    "posts"
                );


            try {

                const response =
                    await fetch(
                        API_URL +
                        "/api/councils/" +
                        councilId +
                        "/posts",
                        {

                            headers: {

                                "Authorization":
                                    "Bearer " +
                                    token

                            }

                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    postsBox.innerHTML =
                        `<div class="empty">
                            ${data.message ||
                            "لا يمكن عرض المنشورات"}
                        </div>`;

                    return;

                }


                if (
                    !data.posts ||
                    data.posts.length === 0
                ) {

                    postsBox.innerHTML =
                        `<div class="empty">
                            لا توجد أخبار أو مناسبات
                            حتى الآن.
                        </div>`;

                    return;

                }


                postsBox.innerHTML =
                    data.posts.map(
                        post => `

                        <article class="post-card">

                            <span class="post-type">
                                ${post.type}
                            </span>

                            <h3>
                                ${escapeHTML(
                                    post.title
                                )}
                            </h3>

                            <p>
                                ${escapeHTML(
                                    post.content
                                )}
                            </p>

                            <div class="post-meta">
                                نشر بواسطة:
                                ${escapeHTML(
                                    post.author
                                )}
                            </div>

                        </article>

                    `
                    ).join("");


            } catch (error) {

                console.error(error);

                postsBox.innerHTML =
                    `<div class="empty">
                        تعذر الاتصال بالخادم.
                    </div>`;

            }

        }


        // =========================
        // حماية عرض النصوص
        // =========================

        function escapeHTML(text) {

            const div =
                document.createElement(
                    "div"
                );

            div.textContent =
                text || "";

            return div.innerHTML;

        }


        // =========================
        // العودة للرئيسية
        // =========================

        function goBack() {

            window.location.href =
                "index.html";

        }


        // =========================
        // تشغيل الموقع
        // =========================

        loadPosts();

    </script>

</body>

</html>
